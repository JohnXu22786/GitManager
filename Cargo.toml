[package]
name = "git_manager"
version = "0.1.13"
edition = "2021"
description = "A dedicated Git branch & worktree manager GUI"
homepage = "https://github.com/JohnXu22786/GitManager"
repository = "https://github.com/JohnXu22786/GitManager"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["git", "branch", "worktree", "desktop", "gui"]
categories = ["development-tools", "gui"]

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
git2 = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ureq = { version = "2", features = ["json"] }
open = "5"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
ring = "0.17"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = {
    version = "0.61",
    features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"],
}

[dev-dependencies]
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
