name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libxcb1-dev

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "GitManager CI"
          git config --global user.email "gitmanager-ci@users.noreply.invalid"

      - name: Run tests
        id: full_suite
        run: cargo test --all-targets

      # Isolated success can reveal concurrency or cold-start sensitivity; it
      # does not establish causality or override the original suite failure.
      - name: Diagnose macOS bridge fixture in isolation
        if: ${{ failure() && runner.os == 'macOS' && steps.full_suite.outcome == 'failure' }}
        timeout-minutes: 5
        run: cargo test --test product_provider_test bridge_rejects_correlated_and_domain_mismatches_and_cancels_running_fixture -- --exact --nocapture --test-threads=1

      - name: Diagnose macOS consented discovery fixture in isolation
        if: ${{ failure() && runner.os == 'macOS' && steps.full_suite.outcome == 'failure' }}
        timeout-minutes: 5
        run: cargo test --test product_provider_test consented_fake_cli_bridge_preserves_origin_and_rejects_mismatches -- --exact --nocapture --test-threads=1

      - name: Build Linux candidate
        if: ${{ success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CARGO_TARGET_DIR: target/candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
          cargo build --locked --release --bin git_manager --target x86_64-unknown-linux-gnu

      - name: Package Linux candidate
        if: ${{ success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git diff --exit-code HEAD
          rustc --version --verbose > "$RUNNER_TEMP/candidate-rustc.txt"
          cargo --version > "$RUNNER_TEMP/candidate-cargo.txt"
          python3 scripts/package_candidate.py \
            --binary target/candidate/x86_64-unknown-linux-gnu/release/git_manager \
            --source-sha "$GITHUB_SHA" \
            --target x86_64-unknown-linux-gnu \
            --rustc-info "$RUNNER_TEMP/candidate-rustc.txt" \
            --cargo-info "$RUNNER_TEMP/candidate-cargo.txt" \
            --output-dir "$RUNNER_TEMP/gitmanager-candidate"

      - name: Upload Linux candidate
        if: ${{ success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: git_manager-${{ github.sha }}-x86_64-unknown-linux-gnu-unsigned
          path: ${{ runner.temp }}/gitmanager-candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
