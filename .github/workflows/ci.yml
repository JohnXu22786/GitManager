name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Optimize the complete test workload while retaining its runtime checks.
    # The independently selected release profile is unaffected.
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libxcb1-dev

      # Prepare the synthetic fixture's interpreter, separately from the real
      # provider probe deadline. These timings do not establish a failure cause.
      - name: Prepare macOS synthetic Python runtime
        if: runner.os == 'macOS'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$(mktemp -d "$RUNNER_TEMP/provider-python.XXXXXX")"
          trap 'rm -rf "$fixture_root"' EXIT
          mkdir "$fixture_root/work"
          ls -l /usr/bin/python3
          /usr/bin/file /usr/bin/python3
          for phase in cold warm; do
            mkdir "$fixture_root/$phase-home"
            printf 'Synthetic Python runtime readiness: %s launch\n' "$phase"
            (
              cd "$fixture_root/work"
              /usr/bin/time -p /usr/bin/env -i \
                HOME="$fixture_root/$phase-home" PATH="$fixture_root:/usr/bin:/bin" \
                LANG=C.UTF-8 LC_ALL=C.UTF-8 \
                /usr/bin/python3 -c 'import json, os, pathlib, subprocess, sys, time; print(json.dumps({"executable": sys.executable, "resolved_executable": str(pathlib.Path(sys.executable).resolve(strict=True)), "version": sys.version, "environment_keys": sorted(os.environ)}, sort_keys=True))'
            )
          done

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "GitManager CI"
          git config --global user.email "gitmanager-ci@users.noreply.invalid"

      - name: Check production application
        run: cargo check --locked --bin git_manager

      - name: Compile Linux scope test harness
        if: ${{ success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/feat/enforced-adoption-scope' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
          test "$(rustc --version --verbose | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          cargo test --locked --no-run --test product_scope_runtime_view_test --message-format=json-render-diagnostics > "$RUNNER_TEMP/scope-test-build.jsonl"
          git diff --exit-code HEAD

      - name: Package Linux scope test harness
        if: ${{ success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/feat/enforced-adoption-scope' }}
        run: |
          python3 scripts/package_scope_test.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --build-json "$RUNNER_TEMP/scope-test-build.jsonl" \
            --source-sha "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/scope-test-artifacts"

      - name: Upload Linux scope test harness
        if: ${{ success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/feat/enforced-adoption-scope' }}
        uses: actions/upload-artifact@v4
        with:
          name: scope-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-product_scope_runtime_view_test-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/scope-test-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Run tests
        id: full_suite
        if: ${{ !cancelled() }}
        run: cargo test --all-targets

      # Isolated success can reveal concurrency or cold-start sensitivity; it
      # does not establish causality or override the original suite failure.
      - name: Diagnose macOS bridge fixture in isolation
        if: ${{ failure() && runner.os == 'macOS' && steps.full_suite.outcome == 'failure' }}
        timeout-minutes: 5
        run: cargo test --test product_provider_test bridge_rejects_correlated_and_domain_mismatches_and_cancels_running_fixture -- --exact --nocapture --test-threads=1

      - name: Diagnose macOS consented discovery fixture in isolation
        if: ${{ failure() && runner.os == 'macOS' && steps.full_suite.outcome == 'failure' }}
        timeout-minutes: 5
        run: cargo test --test product_provider_test consented_fake_cli_bridge_preserves_origin_and_rejects_mismatches -- --exact --nocapture --test-threads=1

      - name: Build Linux candidate
        if: ${{ success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CARGO_TARGET_DIR: target/candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
          cargo build --locked --release --bin git_manager --target x86_64-unknown-linux-gnu

      - name: Package Linux candidate
        if: ${{ success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git diff --exit-code HEAD
          rustc --version --verbose > "$RUNNER_TEMP/candidate-rustc.txt"
          cargo --version > "$RUNNER_TEMP/candidate-cargo.txt"
          python3 scripts/package_candidate.py \
            --binary target/candidate/x86_64-unknown-linux-gnu/release/git_manager \
            --source-sha "$GITHUB_SHA" \
            --target x86_64-unknown-linux-gnu \
            --rustc-info "$RUNNER_TEMP/candidate-rustc.txt" \
            --cargo-info "$RUNNER_TEMP/candidate-cargo.txt" \
            --output-dir "$RUNNER_TEMP/gitmanager-candidate"

      - name: Upload Linux candidate
        if: ${{ success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: git_manager-${{ github.sha }}-x86_64-unknown-linux-gnu-unsigned
          path: ${{ runner.temp }}/gitmanager-candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  scoped-host-focused:
    name: Scoped host focused tests (Linux)
    if: ${{ github.ref == 'refs/heads/feat/studio-scoped-changes' || github.head_ref == 'feat/studio-scoped-changes' }}
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libxcb1-dev
      - name: Configure Git identity for tests
        run: |
          git config --global user.name "GitManager CI"
          git config --global user.email "gitmanager-ci@users.noreply.invalid"
      - name: Test scoped host behavior
        run: cargo test --locked --test product_studio_change_test
      - name: Test scoped host controls
        if: ${{ !cancelled() }}
        run: cargo test --locked --test product_end_to_end_test controls_modify_play_and_record_each_real_nonbinary_choice -- --exact
